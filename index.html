<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>kiki Power 4</title>
	<link rel="icon" type="image/x-icon" href="/src/favicon.ico">
	<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
	<header>
		<h1>Bienvenue sur le puissance 4 a kiki!</h1>
	</header>
	<main>
		<div class="welcome-section">
			<p>Bienvenue dans le jeu de Puissance 4 ! Configurez votre partie ci-dessous.</p>
		</div>
		
		<div class="game-setup">
			<h2>Configuration de la partie</h2>
			<form action="/start-game" method="POST" class="setup-form">
				<div class="player-section">
					<h3>Joueur 1 (Rouge)</h3>
					<div class="player-info">
						<img src="/src/kiki_rouge.png" alt="Joueur Rouge" class="player-avatar">
						<div class="player-input">
							<label for="player1">Nom du joueur 1:</label>
							<input type="text" id="player1" name="player1" placeholder="Entrez votre nom" required>
						</div>
					</div>
				</div>
				
				<div class="player-section">
					<h3>Joueur 2 (Jaune)</h3>
					<div class="player-info">
						<img src="/src/gab_jaune.png" alt="Joueur Jaune" class="player-avatar">
						<div class="player-input">
							<label for="player2">Nom du joueur 2:</label>
							<input type="text" id="player2" name="player2" placeholder="Entrez votre nom" required>
						</div>
					</div>
				</div>
				
				<div class="game-mode-section">
					<h3>Mode de jeu</h3>
					<div class="mode-selection">
						<input type="radio" id="local" name="gamemode" value="local" checked>
						<label for="local">Tour par tour en local</label>
					</div>
				</div>
				
				<div class="start-section">
					<button type="submit" class="start-button">🎮 Commencer la partie</button>
				</div>
			</form>
		</div>
	</main>
	<footer>
		<p>&copy; 2025, kiki.dyskolos.fr</p>
	</footer>
</body>
</html>
</html>
